<svg width="400" height="150" viewBox="0 0 400 150" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      .text-base {
        font-family: Arial, sans-serif;
        font-weight: 900;
        font-size: 50px;
        text-transform: none;
      }
      /* Mimics the bright lime-green/yellow from image_0.png */
      .highlight { fill: #CCFF00; }
      /* The tech-blue color from image_1.png */
      .brand-blue { fill: #007BFF; }
      /* Base black color */
      .brand-black { fill: #000000; }
    </style>
  </defs>

  <rect width="100%" height="100%" fill="transparent"/>

  <g transform="translate(20, 80)">
    <text x="0" y="0" class="text-base brand-blue">C
      <animateTransform attributeName="transform" type="translate" values="0 0; 0 -15; 0 0" dur="1.2s" repeatCount="indefinite" begin="0s" />
    </text>
    
    <text x="40" y="0" class="text-base brand-black">y
      <animateTransform attributeName="transform" type="translate" values="0 0; 0 -15; 0 0" dur="1.2s" repeatCount="indefinite" begin="0.1s" />
    </text>
    
    <text x="70" y="0" class="text-base brand-black">b
      <animateTransform attributeName="transform" type="translate" values="0 0; 0 -15; 0 0" dur="1.2s" repeatCount="indefinite" begin="0.2s" />
    </text>
    
    <text x="105" y="0" class="text-base brand-black">i
      <animateTransform attributeName="transform" type="translate" values="0 0; 0 -15; 0 0" dur="1.2s" repeatCount="indefinite" begin="0.3s" />
    </text>
    
    <text x="120" y="0" class="text-base brand-black">r
      <animateTransform attributeName="transform" type="translate" values="0 0; 0 -15; 0 0" dur="1.2s" repeatCount="indefinite" begin="0.4s" />
    </text>
    
    <text x="145" y="0" class="text-base highlight">d
      <animateTransform attributeName="transform" type="translate" values="0 0; 0 -15; 0 0" dur="1.2s" repeatCount="indefinite" begin="0.5s" />
      <animate attributeName="fill" values="#CCFF00;#007BFF;#CCFF00" dur="1.2s" repeatCount="indefinite" begin="0.5s" />
    </text>
    
    <text x="180" y="0" class="text-base brand-black">p
      <animateTransform attributeName="transform" type="translate" values="0 0; 0 -15; 0 0" dur="1.2s" repeatCount="indefinite" begin="0.6s" />
    </text>
    
    <text x="215" y="0" class="text-base brand-black">a
      <animateTransform attributeName="transform" type="translate" values="0 0; 0 -15; 0 0" dur="1.2s" repeatCount="indefinite" begin="0.7s" />
    </text>
    
    <text x="245" y="0" class="text-base brand-black">y
      <animateTransform attributeName="transform" type="translate" values="0 0; 0 -15; 0 0" dur="1.2s" repeatCount="indefinite" begin="0.8s" />
    </text>
  </g>

  <rect x="20" y="100" width="300" height="4" fill="#000" opacity="0.1" rx="2">
    <animate attributeName="width" values="300; 250; 300" dur="1.2s" repeatCount="indefinite" />
    <animate attributeName="opacity" values="0.1; 0.05; 0.1" dur="1.2s" repeatCount="indefinite" />
  </rect>
</svg>
